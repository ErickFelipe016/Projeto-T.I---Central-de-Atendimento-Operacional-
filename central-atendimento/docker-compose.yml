services:
  db:
    image: postgres:16-alpine
    container_name: central-atendimento-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: central_atendimento
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - central_atendimento_pgdata:/var/lib/postgresql/data

volumes:
  central_atendimento_pgdata:
